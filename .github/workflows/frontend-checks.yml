name: Frontend Lints and Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Run React Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Standard LTS version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # If you haven't installed tests yet, this step will fail initially!
      # We will address that in Step 3.
      - name: Run Tests
        env:
          # Dummy Vite env so modules that import the Supabase client (e.g.
          # via lib/auth/authSessionService, pulled in transitively by any
          # unit test that touches useAuth or the API client) can load at
          # import time — these are unit tests of pure logic, none of them
          # actually reach Supabase. Same values the Playwright job below
          # already uses for the same reason.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run test

  playwright:
    name: Run Playwright E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          # Dummy Vite env so the SPA can boot. Specs mock Supabase and the API.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_RENDER_API_URL: https://placeholder.example
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
